<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  @for (column of displayedColumns; track column) {
    <ng-container [matColumnDef]="column">
      <th mat-header-cell *matHeaderCellDef>{{ column }}</th>
      <td mat-cell *matCellDef="let element">{{ element[column] }}</td>
    </ng-container>
  }

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Ações</th>
    <td mat-cell *matCellDef="let element">
      <button mat-icon-button color="primary" (click)="edit.emit(element)">
        <mat-icon>edit</mat-icon>
      </button>

      <button mat-icon-button color="warn" (click)="confirmDelete(element)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumnsWithActions"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumnsWithActions;"></tr>
</table>

<div class="pagination-container">
  <div class="pagination-info">
    Itens {{ startItem }} a {{ endItem }} de {{ totalElements }}
  </div>

  <div class="pagination-controls">
    <button mat-icon-button (click)="previousPage()" [disabled]="currentPage === 0">
      <mat-icon>chevron_left</mat-icon>
    </button>

    <button
      mat-button
      *ngFor="let page of visiblePages"
      [color]="page === currentPage ? 'primary' : ''"
      (click)="goToPage(page)">
      {{ page + 1 }}
    </button>

    <button mat-icon-button (click)="nextPage()" [disabled]="currentPage === totalPages - 1">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
</div>
