<mat-form-field appearance="outline" class="full-width">
  <mat-label>{{ label }}</mat-label>
  <input
    #textInput
    matInput
    [placeholder]="placeholder"
    [formControl]="control"
    [attr.inputmode]="inputMode"
    [attr.maxlength]="maxLength"
    (input)="onInput($event)">
</mat-form-field>
