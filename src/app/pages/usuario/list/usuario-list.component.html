<button mat-raised-button color="primary" [routerLink]="['/usuarios/new']">
  <mat-icon>add</mat-icon>
  Novo Usuário
</button>
<app-table
  [displayedColumns]="cols"
  [dataSource]="data()"
  [totalPages]="totalPages()"
  [currentPage]="currentPage()"
  [totalElements]="totalElements()"
  (pageChange)="buscarPagina($event)"
  (edit)="onEdit($event)"
  (delete)="onDelete($event)">
</app-table>
