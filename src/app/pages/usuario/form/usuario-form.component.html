<div class="page-header">
  <h2>{{ isEditMode ? 'Editar Usuário' : 'Novo Usuário' }}</h2>
</div>
<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-container">
  <section class="form-section">
    <h3 class="section-title">Dados Pessoais</h3>
    <div class="form-grid">
      <div class="form-group">
        <app-input-number
          label="ID"
          [placeholder]="'ID'"
          [control]="form.controls['id']">
        </app-input-number>
      </div>
      <div class="form-group form-group--full">
        <app-input-text
          label="Nome completo"
          [placeholder]="'Nome completo'"
          [control]="form.controls['nomeCompleto']">
        </app-input-text>
      </div>
      <div class="form-group">
        <app-input-text
          label="CPF"
          [placeholder]="'CPF'"
          format="cpf"
          [control]="form.controls['cpf']">
        </app-input-text>
      </div>
      <div class="form-group">
        <app-input-date
          label="Data de nascimento"
          [placeholder]="'Data de nascimento'"
          [control]="form.controls['dataNascimento']">
        </app-input-date>
      </div>
    </div>
  </section>
  <section class="form-section">
    <h3 class="section-title">Informações de Contato</h3>
    <div class="form-grid">
      <div class="form-group form-group--full">
        <app-input-text
          label="e-Mail"
          [placeholder]="'e-Mail'"
          [control]="form.controls['email']">
        </app-input-text>
      </div>
      <div class="form-group">
        <app-input-text
          label="Telefone"
          [placeholder]="'Telefone'"
          format="phone"
          [control]="form.controls['telefone']">
        </app-input-text>
      </div>
      <div class="form-group">
        <app-input-boolean
          label="Whatsapp?"
          [control]="form.controls['whatsapp']">
        </app-input-boolean>
      </div>
    </div>
  </section>
  <section class="form-section">
    <h3 class="section-title">Dados de Acesso</h3>
    <div class="form-grid">
      <div class="form-group">
        <app-input-select
          label="Tipo de usuário"
          [options]="tipos"
          [control]="form.controls['tipoUsuario']">
        </app-input-select>
      </div>
      @if (!isEditMode) {
        <div class="form-group">
          <app-input-password
            [label]="'Senha'"
            [placeholder]="'Digite a senha'"
            [control]="form.controls['senha']">
          </app-input-password>
        </div>
      }
    </div>
  </section>
  <div class="form-actions">
    <button mat-raised-button color="primary" type="submit" class="btn-submit">
      {{ isEditMode ? 'Salvar Alterações' : 'Cadastrar' }}
    </button>
  </div>
</form>
